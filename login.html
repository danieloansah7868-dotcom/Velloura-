<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Login — VELLOURA Seller Center</title>
  <meta name="description" content="Log in to the VELLOURA seller center.">
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="auth-body">
  <main class="auth-wrap">
    <a class="auth-logo" href="index.html">
      <img src="assets/logo.png" alt="VELLOURA" width="56" height="56">
    </a>
    <form class="auth-card" id="login-form" novalidate>
      <h1>Welcome to Velloura</h1>
      <p class="muted">Log in to Seller Center to see orders and products.</p>

      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="username" required placeholder="you@email.com">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </div>

      <p id="login-error" class="error-text" hidden></p>
      <button class="btn btn-primary btn-full" type="submit">Log in</button>
      <p class="auth-hint">Demo login: <strong>admin@velloura.com</strong> / <strong>velloura</strong></p>
      <a class="auth-back" href="index.html">← Back to shop</a>
    </form>
  </main>
  <script type="module" src="js/login.js"></script>
</body>
</html>
