<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Login — VELLOURA</title>
  <meta name="description" content="Log in or create a VELLOURA customer account.">
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
</head>
<body class="auth-body">
  <main class="auth-wrap">
    <a class="auth-logo" href="index.html">
      <img src="assets/logo.png" alt="VELLOURA" width="56" height="56">
    </a>

    <section class="auth-card" id="login-panel">
      <h1>Login</h1>
      <p class="muted">Welcome back. Log in to see your orders.</p>
      <button class="btn btn-google btn-full" type="button" id="google-login" data-google="login">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.4h6.5c-.3 1.5-1.2 2.8-2.5 3.7v3h4c2.4-2.2 3.5-5.4 3.5-8.8z"/>
          <path fill="#34A853" d="M12 24c3.2 0 5.9-1.1 7.9-2.9l-4-3c-1.1.8-2.5 1.2-3.9 1.2-3 0-5.6-2-6.5-4.8H1.3v3.1C3.3 21.4 7.4 24 12 24z"/>
          <path fill="#FBBC05" d="M5.5 14.5c-.2-.7-.4-1.4-.4-2.5s.1-1.8.4-2.5V6.4H1.3C.5 8.1 0 10 0 12s.5 3.9 1.3 5.6l4.2-3.1z"/>
          <path fill="#EA4335" d="M12 4.8c1.7 0 3.3.6 4.5 1.7l3.4-3.4C17.9 1.1 15.2 0 12 0 7.4 0 3.3 2.6 1.3 6.4l4.2 3.1C6.4 6.8 9 4.8 12 4.8z"/>
        </svg>
        Continue with Google
      </button>
      <p class="auth-divider"><span>or</span></p>
      <form id="customer-login-form" novalidate>
        <div class="field">
          <label for="login-email">Email</label>
          <input id="login-email" name="email" type="email" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="login-password">Password</label>
          <input id="login-password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <p id="login-error" class="error-text" hidden></p>
        <button class="btn btn-primary btn-full" type="submit">Log in</button>
      </form>
      <p class="auth-hint">New here? <a href="#" data-show-panel="register">Create an account</a></p>
      <a class="auth-back" href="index.html">← Back to shop</a>
    </section>

    <section class="auth-card" id="register-panel" hidden>
      <h1>Create account</h1>
      <p class="muted">Shop faster next time and track your orders.</p>
      <button class="btn btn-google btn-full" type="button" id="google-register" data-google="register">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.4h6.5c-.3 1.5-1.2 2.8-2.5 3.7v3h4c2.4-2.2 3.5-5.4 3.5-8.8z"/>
          <path fill="#34A853" d="M12 24c3.2 0 5.9-1.1 7.9-2.9l-4-3c-1.1.8-2.5 1.2-3.9 1.2-3 0-5.6-2-6.5-4.8H1.3v3.1C3.3 21.4 7.4 24 12 24z"/>
          <path fill="#FBBC05" d="M5.5 14.5c-.2-.7-.4-1.4-.4-2.5s.1-1.8.4-2.5V6.4H1.3C.5 8.1 0 10 0 12s.5 3.9 1.3 5.6l4.2-3.1z"/>
          <path fill="#EA4335" d="M12 4.8c1.7 0 3.3.6 4.5 1.7l3.4-3.4C17.9 1.1 15.2 0 12 0 7.4 0 3.3 2.6 1.3 6.4l4.2 3.1C6.4 6.8 9 4.8 12 4.8z"/>
        </svg>
        Continue with Google
      </button>
      <p class="auth-divider"><span>or</span></p>
      <form id="customer-register-form" novalidate>
        <div class="field">
          <label for="reg-name">Full name</label>
          <input id="reg-name" name="name" type="text" autocomplete="name" required>
        </div>
        <div class="field">
          <label for="reg-email">Email</label>
          <input id="reg-email" name="email" type="email" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="reg-phone">Phone</label>
          <input id="reg-phone" name="phone" type="tel" placeholder="0XX XXX XXXX" autocomplete="tel" required>
        </div>
        <div class="field">
          <label for="reg-password">Password</label>
          <input id="reg-password" name="password" type="password" autocomplete="new-password" required>
        </div>
        <p id="register-error" class="error-text" hidden></p>
        <button class="btn btn-primary btn-full" type="submit">Create account</button>
      </form>
      <p class="auth-hint">Already have an account? <a href="#" data-show-panel="login">Log in</a></p>
      <a class="auth-back" href="index.html">← Back to shop</a>
    </section>
  </main>
  <script type="module" src="js/account-login.js"></script>
</body>
</html>
